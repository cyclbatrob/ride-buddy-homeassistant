name: HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Not in the home-assistant/brands repo (it's a custom integration).
          ignore: brands
