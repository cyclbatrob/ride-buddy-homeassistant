name: release

# Push a tag like v1.0.3 (matching manifest.json's version) and this publishes the release
# HACS offers as an update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the manifest's version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/ride_buddy/manifest.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but manifest says $version"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
